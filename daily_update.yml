name: 每日自动更新工作台数据

on:
  schedule:
    # 每天北京时间16:30运行（收盘后），UTC时间08:30
    - cron: '30 8 * * 1-5'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行更新脚本
        run: python3 update_workbench.py

      - name: 提交并推送更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git diff --staged --quiet || git commit -m "自动更新: $(date '+%Y-%m-%d') 上证指数行情数据"
          git push
